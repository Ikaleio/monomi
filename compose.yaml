services:
  monomi:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONOMI_PORT:-3000}:3000"
    environment:
      MONOMI_HOST: 0.0.0.0
      MONOMI_PORT: 3000
      MONOMI_DATA_DIR: /data
      MONOMI_AUTH_MODE: ${MONOMI_AUTH_MODE:-password}
      MONOMI_SECURE_COOKIE: ${MONOMI_SECURE_COOKIE:-false}
      MONOMI_CHECK_CONCURRENCY: ${MONOMI_CHECK_CONCURRENCY:-10}
    volumes:
      - ./monomi-data:/data
